{% extends 'shop/layouts/main.html' %}
{% block content %}
<h2>Payment for Order #{{ order.id }}</h2>
<p>Total: ₹{{ order.total_price }}</p>

<form method="post">{% csrf_token %}
  <label><input type="radio" name="payment_mode" value="Cash on Delivery" checked> Cash on Delivery</label><br>
  <label><input type="radio" name="payment_mode" value="Online"> Online Payment (demo)</label><br>
  <button type="submit">Confirm Payment</button>
</form>
{% endblock %}
