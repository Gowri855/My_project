{% extends 'shop/layouts/main.html' %}
{% block content %}
<h2>My Orders</h2>
<table>
  <tr><th>ID</th><th>Date</th><th>Total</th><th>Status</th></tr>
  {% for order in orders %}
    <tr>
      <td>{{ order.id }}</td>
      <td>{{ order.created_at }}</td>
      <td>₹{{ order.total_price }}</td>
      <td>{{ order.status }}</td>
    </tr>
  {% empty %}
    <tr><td colspan="4">No orders yet</td></tr>
  {% endfor %}
</table>
{% endblock %}
