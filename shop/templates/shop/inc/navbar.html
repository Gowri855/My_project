<nav class="navbar navbar-expand-lg bg-dark border-bottom fixed-top" data-bs-theme="dark">
  <div class="container-fluid px-3">
    <!-- Brand -->
    <a class="navbar-brand fw-bold" href="{% url 'shop:home' %}">
      <i class="fa fa-heart text-danger"></i> Whoops!
    </a>

    <!-- Mobile Toggle Button -->
    <button 
      class="navbar-toggler" 
      type="button" 
      data-bs-toggle="collapse" 
      data-bs-target="#navbarMain" 
      aria-controls="navbarMain" 
      aria-expanded="false" 
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Collapsible Navbar Content -->
    <div class="collapse navbar-collapse" id="navbarMain">
      <!-- Left Side Navigation -->
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}" 
             href="{% url 'shop:home' %}">
            <i class="fa fa-home"></i> Home
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'collections' %}active{% endif %}" 
             href="{% url 'shop:collections' %}">
            <i class="fa fa-th-large"></i> Collections
          </a>
        </li>
      </ul>

      <!-- Right Side Navigation -->
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
        {% if request.user.is_authenticated %}
          <!-- Logged In User -->
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" 
               data-bs-toggle="dropdown" aria-expanded="false">
              <i class="fa fa-user-circle"></i> {{ request.user.username|truncatechars:15 }}
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="#"><i class="fa fa-user"></i> Profile</a></li>
              <li><a class="dropdown-item" href="#"><i class="fa fa-box"></i> Orders</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="{% url 'shop:logout' %}">
                <i class="fa fa-sign-out"></i> Logout
              </a></li>
            </ul>
          </li>
        {% else %}
          <!-- Guest User -->
          <li class="nav-item">
            <a class="nav-link" href="{% url 'shop:login' %}">
              <i class="fa fa-sign-in"></i> Login
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'shop:register' %}">
              <i class="fa fa-user-plus"></i> Register
            </a>
          </li>
        {% endif %}

        <!-- Wishlist -->
        <li class="nav-item">
          <a class="nav-link position-relative" href="{% url 'shop:wishlistview' %}">
            <i class="fa fa-heart"></i>
            <span class="d-lg-none ms-1">Wishlist</span>
          </a>
        </li>

        <!-- Cart -->
        <li class="nav-item">
          <a class="nav-link position-relative" href="{% url 'shop:cart' %}">
            <i class="fa fa-shopping-cart"></i>
            <span class="d-lg-none ms-1">Cart</span>
          </a>
        </li>

        <!-- Search (Desktop Only - Hidden on Mobile to Save Space) -->
        <li class="nav-item d-none d-lg-block">
          <form class="d-flex" role="search" method="GET" action="{% url 'shop:collections' %}">
            <div class="input-group input-group-sm">
              <input 
                class="form-control" 
                type="search" 
                placeholder="Search..." 
                aria-label="Search"
                name="q"
                style="min-width: 150px;"
              >
              <button class="btn btn-outline-success" type="submit">
                <i class="fa fa-search"></i>
              </button>
            </div>
          </form>
        </li>
      </ul>

      <!-- Mobile Search (Visible Only on Small Screens) -->
      <form class="d-lg-none mt-3" role="search" method="GET" action="{% url 'shop:collections' %}">
        <div class="input-group">
          <input 
            class="form-control" 
            type="search" 
            placeholder="Search products..." 
            aria-label="Search"
            name="q"
          >
          <button class="btn btn-success" type="submit">
            <i class="fa fa-search"></i> Search
          </button>
        </div>
      </form>
    </div>
  </div>
</nav>

<!-- Add spacing below fixed navbar -->
<div style="margin-top: 70px;"></div>
